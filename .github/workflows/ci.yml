name: SGTech checks

on:
  push:
    paths:
      - "e-commerce/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/operations.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "e-commerce/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/operations.yml"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: sgtech-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e-commerce
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/sgtech_ci?replicaSet=rs0
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-placeholder-not-a-deployment-secret
      QA_BROWSER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Start an isolated MongoDB replica set
        run: |
          mkdir -p .artifacts
          docker run --detach --name sgtech-mongo --publish 27017:27017 --volume "$PWD:$PWD" mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec sgtech-mongo mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec sgtech-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec sgtech-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          printf '#!/usr/bin/env bash\ndocker exec sgtech-mongo mongodump "$@"\n' > "$RUNNER_TEMP/sgtech-mongodump"
          printf '#!/usr/bin/env bash\ndocker exec sgtech-mongo mongorestore "$@"\n' > "$RUNNER_TEMP/sgtech-mongorestore"
          chmod +x "$RUNNER_TEMP/sgtech-mongodump" "$RUNNER_TEMP/sgtech-mongorestore"
          echo "MONGODUMP_BIN=$RUNNER_TEMP/sgtech-mongodump" >> "$GITHUB_ENV"
          echo "MONGORESTORE_BIN=$RUNNER_TEMP/sgtech-mongorestore" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build --webpack
      - run: npm run test:stock-mongo
      - run: npm run test:catalog-mongo
      - run: npm run test:content-mongo
      - run: npm run test:support-mongo
      - run: npm run test:support-tickets-mongo
      - run: npm run test:returns-mongo
      - run: npm run test:customer-service-mongo
      - run: npm run test:email-mongo
      - run: npm run test:operations-mongo
      - run: npm run test:returns-e2e
      - run: npm run test:operations-e2e
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgtech-verification-${{ github.sha }}
          path: e-commerce/.artifacts/*results.json
          include-hidden-files: true
          if-no-files-found: ignore
