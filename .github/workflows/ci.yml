name: SGTech checks

on:
  push:
    paths:
      - "e-commerce/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "e-commerce/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: sgtech-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e-commerce
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/sgtech_ci?replicaSet=rs0
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-placeholder-not-a-deployment-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build --webpack
